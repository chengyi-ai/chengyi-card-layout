<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ChengYi · 正在更新图文工具</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f3f2ed;
      color: #1d1d1b;
    }
    main {
      width: min(520px, calc(100% - 40px));
      padding: 44px;
      border: 1px solid #ddd9cf;
      border-radius: 28px;
      background: #fffefa;
      box-shadow: 0 24px 70px rgba(31, 31, 27, .12);
    }
    small { color: #858276; letter-spacing: .16em; }
    h1 { margin: 14px 0 10px; font: 500 clamp(30px, 7vw, 48px)/1.08 Georgia, "Songti SC", serif; }
    p { margin: 0; color: #69665d; font-size: 17px; line-height: 1.75; }
    .progress { height: 7px; margin: 30px 0 24px; overflow: hidden; border-radius: 999px; background: #e9e6dc; }
    .progress::after {
      display: block;
      width: 48%;
      height: 100%;
      border-radius: inherit;
      background: #1d1d1b;
      content: "";
      animation: loading 1s ease-in-out infinite alternate;
    }
    a { color: inherit; font-weight: 700; }
    [hidden] { display: none !important; }
    @keyframes loading { to { transform: translateX(108%); } }
  </style>
</head>
<body>
  <main>
    <small>CHENGYI CREATOR TOOLKIT</small>
    <h1>正在更新图文工具</h1>
    <p id="status">正在清理旧版离线缓存，草稿内容不会被删除。</p>
    <div class="progress" aria-hidden="true"></div>
    <p id="retryWrap" hidden>请关闭其他旧的图文工具页面，然后<a id="retryLink" href="card-layout-reset.html?v=20260915-draft-autosave-v1">重新清理</a>。</p>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const retryWrap = document.getElementById('retryWrap');
      const target = new URL('index.html', location.href);
      target.searchParams.set('v', '20260915-draft-autosave-v1');
      target.searchParams.set('cache-reset', String(Date.now()));
      const isCardLayoutScope = (scope) => {
        try {
          const url = new URL(scope);
          return url.origin === location.origin && url.pathname.startsWith('/');
        } catch {
          return false;
        }
      };
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(
            registrations
              .filter((registration) => isCardLayoutScope(registration.scope))
              .map((registration) => registration.unregister())
          );
          const remainingRegistrations = await navigator.serviceWorker.getRegistrations();
          if (remainingRegistrations.some((registration) => isCardLayoutScope(registration.scope))) {
            status.textContent = '旧版缓存仍被其他页面占用，暂未进入图文工具。';
            retryWrap.hidden = false;
            return;
          }
        }
      } catch {
        status.textContent = '旧版缓存暂时无法退出，暂未进入图文工具。';
        retryWrap.hidden = false;
        return;
      }
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(
            keys
              .filter((key) => key.startsWith('card-tool-'))
              .map((key) => caches.delete(key))
          );
        }
      } catch {
        // Service Worker 已确认注销；普通 HTTP 缓存不影响带新版本参数的页面。
      }
      status.textContent = '旧版缓存已清理，正在打开最新版。';
      location.replace(target.href);
    })();
  </script>
</body>
</html>
